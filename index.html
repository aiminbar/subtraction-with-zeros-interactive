<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الطرح مع وجود أصفار</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f7f4ef;color:#173f67}button{font:inherit}.page{display:none;min-height:100vh;padding:16px}.page.active{display:block}.home{padding:0;background:#dff4ff;position:relative}.home img{width:100%;height:100vh;object-fit:contain;display:block}.hot{position:absolute;background:transparent;border:0;cursor:pointer}.teacher-hot{left:17%;bottom:6%;width:12%;height:12%}.nav{position:fixed;top:14px;z-index:60;width:48px;height:48px;border:0;border-radius:50%;box-shadow:0 3px 12px #0002;background:#fff;font-size:24px;cursor:pointer}.homebtn{right:14px}.penbtn{left:14px}.header{max-width:1100px;margin:0 auto 14px;background:#fff;border:3px solid #bde6ef;border-radius:24px;padding:14px;text-align:center;font-size:32px;font-weight:800}.card{max-width:1100px;margin:0 auto;background:#fff;border-radius:24px;padding:18px;box-shadow:0 5px 20px #0001}.video{width:100%;max-height:68vh;border-radius:18px;background:#000}.controls{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}.controls button,.choice{border:0;border-radius:14px;padding:12px 20px;background:#dff3ff;color:#17466f;font-weight:700;cursor:pointer}.boardwrap{position:relative;max-width:1100px;margin:auto}.boardwrap>img{width:100%;display:block;border-radius:20px}.board{position:absolute;left:26%;top:13%;width:59%;height:58%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#153d67}.board h2{margin:0 0 10px;font-size:clamp(18px,2vw,30px)}table{border-collapse:collapse;font-size:clamp(18px,2.4vw,34px);text-align:center}th,td{padding:4px 14px;border:1px solid #8ec8df}.eq{font-size:clamp(22px,3vw,40px);font-weight:800;margin-top:10px}.strike{text-decoration:line-through;text-decoration-thickness:3px;position:relative}.new{font-size:.65em;position:absolute;top:-20px;right:0;color:#c43}.hint{margin-top:8px;background:#fff5bf;padding:7px 14px;border-radius:14px;font-weight:700}.mascotBubble{position:absolute;right:2%;bottom:8%;background:white;border-radius:18px;padding:10px;max-width:180px;box-shadow:0 4px 14px #0002;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.tile{background:#f2fbff;border:2px solid #cbeaf2;border-radius:20px;padding:20px;text-align:center;cursor:pointer;font-weight:800;font-size:22px}.quiz{font-size:22px;text-align:center}.choice{display:block;width:100%;margin:8px 0}.overlay{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:100}.overlay.show{display:flex}.overlay video{max-width:60vw;max-height:70vh;background:transparent}.tools{position:fixed;left:14px;top:70px;z-index:80;background:#fff;border-radius:16px;padding:8px;box-shadow:0 4px 18px #0003;display:none;gap:6px;flex-wrap:wrap;width:220px}.tools.show{display:flex}.tools button{border:0;border-radius:10px;padding:8px;background:#eef7fb;cursor:pointer}.swatch{width:28px;height:28px;border-radius:50%!important;border:2px solid #ddd!important}.canvas{position:fixed;inset:0;z-index:70;pointer-events:none}.canvas.draw{pointer-events:auto;touch-action:none}.chest{max-width:850px;margin:auto;position:relative}.chest>img{width:100%}.lock{position:absolute;width:13%;border:0;background:transparent;padding:0;cursor:pointer;transform:translate(-50%,-50%)}.lock img{width:100%;display:block;filter:drop-shadow(0 4px 6px #0003)}.l1{left:35%;top:49%}.l2{left:50%;top:49%}.l3{left:65%;top:49%}.done{cursor:default}.small{font-size:16px;color:#567}.shine{animation:shine .7s ease 2}@keyframes shine{50%{filter:brightness(1.3)}}
</style></head><body>
<canvas id="draw" class="canvas"></canvas><button class="nav penbtn" id="pen">✏️</button><div class="tools" id="tools"><button data-tool="pen">✏️ قلم</button><button data-tool="high">🖍️ محدد</button><button data-tool="eraser">🧽 ممحاة</button><button id="undo">↶</button><button id="clear">🗑️</button><button id="closeTools">✕</button><button class="swatch" data-color="#173f67" style="background:#173f67"></button><button class="swatch" data-color="#e84d7a" style="background:#e84d7a"></button><button class="swatch" data-color="#f1c232" style="background:#f1c232"></button><button class="swatch" data-color="#35a98b" style="background:#35a98b"></button></div>
<section id="home" class="page home active"><img src="home.png"><button class="hot" style="right:12%;top:33%;width:17%;height:18%" onclick="go('rules')"></button><button class="hot" style="right:30%;top:33%;width:16%;height:18%" onclick="go('ready')"></button><button class="hot" style="right:47%;top:33%;width:16%;height:18%" onclick="go('learn')"></button><button class="hot" style="right:64%;top:33%;width:16%;height:18%" onclick="go('practice')"></button><button class="hot" style="right:10%;top:56%;width:15%;height:18%" onclick="go('play')"></button><button class="hot" style="right:26%;top:56%;width:15%;height:18%" onclick="go('assessment')"></button><button class="hot" style="right:42%;top:56%;width:15%;height:18%" onclick="go('nation')"></button><button class="hot" style="right:58%;top:56%;width:15%;height:18%" onclick="go('connect')"></button><button class="hot" style="right:73%;top:56%;width:12%;height:18%" onclick="go('ein')"></button><button class="hot" style="right:84%;top:56%;width:12%;height:18%" onclick="go('homework')"></button></section>
<div id="pages"></div><div class="overlay" id="feedback"><video id="feedbackVideo" playsinline></video></div>
<script>
const defs={rules:['الْقَوَانِينُ الصَّفِّيَّةُ','video','class-rules.mp4'],ready:['أَتَهَيَّأُ','video','get-ready.mp4'],practice:['أَتَدَرَّبُ','practice'],assessment:['التَّقْوِيمُ التَّجْمِيعِيُّ','assessment'],nation:['وَطَنِي مَسْؤُولِيَّتِي','nation'],connect:['أَرْبِطُ تَعَلُّمِي','connect'],ein:['قَنَاةُ عَيْنٍ','ein'],homework:['وَاجِبِي','video','homework.mp4'],play:['أَلْعَبُ وَأُطَبِّقُ','play']};
const pages=document.getElementById('pages'); for(const [id,d] of Object.entries(defs)){let s=document.createElement('section');s.id=id;s.className='page';s.innerHTML=`<button class="nav homebtn" onclick="go('home')">🏠</button><div class="header">${d[0]}</div><div class="card" id="${id}body"></div>`;pages.appendChild(s)}
function video(src){return `<video class="video" controls playsinline src="${src}"></video>`}
rulesbody.innerHTML=video(defs.rules[2]);readybody.innerHTML=video(defs.ready[2]);homeworkbody.innerHTML=video(defs.homework[2]);
let step=0;function renderLearn(){const states=[['',''],['٠ − ٠ = ٠',''],['٠ − ٣','لا أستطيع الطرح!'],['','١ مئة = ١٠ عشرات'],['١٠ − ٣ = ٧',''],['٠ − ٤','نحتاج إلى إعادة التجميع مرة أخرى!'],['١٠ − ٤ = ٦',''],['٢ − ٠ = ٢','']];let [eq,h]=states[step];let a=step>=3?'<span class="strike">١<span class="new">٠</span></span>':'١',t=step>=3?'<span class="strike">٠<span class="new">١٠</span></span>':'٠',th=step>=6?'<span class="strike">٣<span class="new">٢</span></span>':'٣',hu=step>=6?'<span class="strike">٠<span class="new">١٠</span></span>':a;let res=['','','','', '٧','٧','٦٧','٢٦٧٠'][step]||'';learnbody.innerHTML=`<div class="boardwrap"><img src="learn-board.png"><div class="board"><h2>أَتَعَلَّمُ | كيف أطرح مع وجود أصفار؟</h2><table><tr><th>الألوف</th><th>المئات</th><th>العشرات</th><th>الآحاد</th></tr><tr><td>${th}</td><td>${hu}</td><td>${t}</td><td>٠</td></tr><tr><td>٠</td><td>٤</td><td>٣</td><td>٠</td></tr><tr><td colspan="4">ــــــــــــــــــــــــــــ</td></tr><tr><td colspan="4">${res}${step===7?' ✓':''}</td></tr></table><div class="eq">${eq}</div>${h?`<div class="hint">${h}</div>`:''}</div>${step===2?'<div class="mascotBubble">من أي منزلة نُعيد التجميع؟ 🤔</div>':''}</div><div class="controls"><button onclick="step=Math.max(0,step-1);renderLearn()">السابق</button><button onclick="renderLearn()">إعادة الخطوة ↻</button><button onclick="step=Math.min(7,step+1);renderLearn()">التالي</button></div>`;if(step===7)learnbody.querySelector('.board').classList.add('shine')}
let learn=document.createElement('section');learn.id='learn';learn.className='page';learn.innerHTML='<button class="nav homebtn" onclick="go(\'home\')">🏠</button><div class="header">أَتَعَلَّمُ</div><div class="card" id="learnbody"></div>';pages.appendChild(learn);renderLearn();
const qs=[['٣٠٠ − ١٠٠ = ؟',['٢٠٠','٣٠٠','٤٠٠'],0],['٥٠٠ − ٢٠٠ = ؟',['٢٠٠','٣٠٠','٤٠٠'],1],['٨٠٠ − ٣٠٠ = ؟',['٤٠٠','٥٠٠','٦٠٠'],1]];function quizHTML(arr=qs){return arr.map((q,i)=>`<div class="quiz"><b>${q[0]}</b>${q[1].map((x,j)=>`<button class="choice" onclick="answer(${j===q[2]},this)">${x}</button>`).join('')}</div>`).join('')}practicebody.innerHTML=quizHTML();assessmentbody.innerHTML=quizHTML([...qs,['إذا كان مع سارة ١٠٠٠ ريال وأنفقت ٣٢٠ ريالًا، فكم بقي؟',['٦٨٠','٧٨٠','٨٢٠'],0],['لماذا نعيد التجميع عند الحاجة؟',['لأن الرقم في المنزلة لا يكفي للطرح','لتغيير ترتيب المنازل','لإضافة أصفار'],0]]);
const lockData=[
{closed:'lock-blue-closed.png',open:'lock-blue-open.png',q:'٣٠٠٠ − ٤٣٠ = ؟',choices:['٢٥٧٠','٢٦٧٠','٢٧٧٠'],ans:1},
{closed:'lock-pink-closed.png',open:'lock-pink-open.png',q:'٥٠٠٠ − ٢٣٠ = ؟',choices:['٤٦٧٠','٤٧٧٠','٤٨٧٠'],ans:1},
{closed:'lock-yellow-closed.png',open:'lock-yellow-open.png',q:'٧٠٠٠ − ٤٢٠ = ؟',choices:['٦٤٨٠','٦٥٨٠','٦٦٨٠'],ans:1}
];let unlocked=0,activeLock=null;
playbody.innerHTML=video('chest-intro.mp4')+`<div class="chest"><img src="chest-base.png"><button class="lock l1" onclick="openLockQuestion(0,this)"><img src="${lockData[0].closed}"></button><button class="lock l2" onclick="openLockQuestion(1,this)"><img src="${lockData[1].closed}"></button><button class="lock l3" onclick="openLockQuestion(2,this)"><img src="${lockData[2].closed}"></button></div><div id="lockQuestion"></div><div id="chestEnd"></div>`;
function openLockQuestion(i,b){if(b.classList.contains('done'))return;activeLock={i,b};let q=lockData[i];lockQuestion.innerHTML=`<div class="quiz"><h2>${q.q}</h2>${q.choices.map((x,j)=>`<button class="choice" onclick="answerLock(${j})">${x}</button>`).join('')}</div>`;lockQuestion.scrollIntoView({behavior:'smooth',block:'center'})}
function answerLock(j){if(!activeLock)return;let {i,b}=activeLock,q=lockData[activeLock.i];if(j===q.ans){b.querySelector('img').src=q.open;b.classList.add('done');unlocked++;showFeedback('correct.mp4');lockQuestion.innerHTML='';activeLock=null;if(unlocked===3){setTimeout(()=>{chestEnd.innerHTML=video('chest-outro.mp4');let v=chestEnd.querySelector('video');if(v)v.play().catch(()=>{});},700)}}else showFeedback('retry.mp4')}
connectbody.innerHTML=video('connect-intro.mp4')+`<div class="grid"><div class="tile" onclick="showFeedback('life.mp4')">فِي حَيَاتِنَا</div><div class="tile" onclick="showFeedback('social.mp4')">الاجتماعيات</div><div class="tile" onclick="showFeedback('science.mp4')">العلوم</div></div>`;nationbody.innerHTML=`<div class="quiz"><h2>ترشيد الاستهلاك مسؤولية وطنية 🇸🇦</h2><p>اختاري السلوك الذي يساعد على المحافظة على موارد وطننا:</p><button class="choice" onclick="showFeedback('nation.mp4')">إغلاق صنبور الماء بعد الاستخدام</button><button class="choice" onclick="showFeedback('retry.mp4')">ترك الأجهزة تعمل دون حاجة</button></div>`;einbody.innerHTML=`<div class="card"><h2>درس الطرح مع وجود أصفار – قناة عين</h2><p class="small">يفتح الفيديو التعليمي في نافذة جديدة.</p><button class="choice" onclick="window.open('https://youtu.be/W14Y5C380ho?feature=shared','_blank')">▶️ مشاهدة الدرس</button></div>`;
function answer(ok,b){showFeedback(ok?'correct.mp4':'retry.mp4');if(ok){b.style.background='#d7f6e6'}}function showFeedback(src){feedbackVideo.src=src;feedback.classList.add('show');feedbackVideo.play();feedbackVideo.onended=()=>{feedback.classList.remove('show');feedbackVideo.src=''}}
function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');clearCanvas();document.querySelectorAll('video').forEach(v=>{if(!v.closest('#'+id)&&v!==feedbackVideo)v.pause()})}
// teacher drawing tool
const c=draw,ctx=c.getContext('2d');let drawing=false,tool='pen',color='#173f67',hist=[];function size(){c.width=innerWidth;c.height=innerHeight}size();addEventListener('resize',size);pen.onclick=()=>tools.classList.toggle('show');closeTools.onclick=()=>{tools.classList.remove('show');c.classList.remove('draw')};tools.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;c.classList.add('draw')});tools.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>color=b.dataset.color);function pos(e){let p=e.touches?e.touches[0]:e;return [p.clientX,p.clientY]}function snap(){hist.push(c.toDataURL());if(hist.length>20)hist.shift()}c.addEventListener('pointerdown',e=>{snap();drawing=true;let[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)});c.addEventListener('pointermove',e=>{if(!drawing)return;let[x,y]=pos(e);ctx.lineCap='round';ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';ctx.globalAlpha=tool==='high'?.28:1;ctx.lineWidth=tool==='high'?24:tool==='eraser'?30:4;ctx.strokeStyle=color;ctx.lineTo(x,y);ctx.stroke()});c.addEventListener('pointerup',()=>drawing=false);undo.onclick=()=>{let u=hist.pop();clearCanvas(false);if(u){let im=new Image;im.onload=()=>ctx.drawImage(im,0,0);im.src=u}};clear.onclick=()=>clearCanvas();function clearCanvas(reset=true){ctx.clearRect(0,0,c.width,c.height);if(reset)hist=[]}
</script></body></html>
